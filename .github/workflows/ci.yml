name: CI

on:
  pull_request:
  push:
    branches: [main, production]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다. 러너 시간을 아끼고 오래된 결과가 남지 않게.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-migrations 가 base 브랜치와 diff 를 내려면 전체 히스토리가 필요하다
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 마이그레이션 파일명·불변성·RLS 검사. 규칙은 .cursor/rules/supabase.mdc
      - name: Check migrations
        run: pnpm check:migrations

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 어드민에서 고르는 값(표시 방식·variant·순서…)이 실제로 다른 화면을 만드는지. 브라우저·DB 없음
      - name: QA render matrix
        run: pnpm qa:render

      # ISR 빌드가 공개 페이지를 미리 렌더할 때 Supabase 가 필요하다.
      # NEXT_PUBLIC_* 는 브라우저에 노출되는 공개 값. 저장소 Variables 에 둔다.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build
